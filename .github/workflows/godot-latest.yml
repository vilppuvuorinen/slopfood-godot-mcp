name: Godot latest

# Runs the e2e suite against the newest published Godot build for every minor
# line at or above the manually maintained lower bound. Unlike the pinned
# manifest used locally, this chases upstream (dev builds included) so breakage
# with an upcoming release surfaces early. It is intentionally not scheduled and
# not run on pull requests, where a new upstream release could turn a green PR
# red for unrelated reasons.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-latest-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.1"
  # Lowest supported minor line; bump by hand when support is raised.
  MIN_GODOT_MINOR: "4.7"

jobs:
  # Discover which minor lines >= MIN_GODOT_MINOR have published releases via
  # the downloader's "minors" subcommand, which shallow-clones the godot-builds
  # release manifests. The release within each line (dev/beta/rc included) is
  # resolved and installed later, per job, by the downloader's install-latest
  # subcommand from the minor alone.
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        run: |
          set -euo pipefail
          minors=$(scripts/download-godot.py minors "$MIN_GODOT_MINOR")
          if [[ -z "$minors" ]]; then
            echo "::error::no Godot releases found for minors >= $MIN_GODOT_MINOR" >&2
            exit 1
          fi

          include=""
          while IFS= read -r key; do
            [[ -n "$key" ]] || continue
            [[ -z "$include" ]] || include+=","
            include+="{\"minor\":\"$key\"}"
          done <<<"$minors"

          echo "matrix={\"include\":[$include]}" >> "$GITHUB_OUTPUT"

  e2e:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    env:
      # Godot looks for export templates under $XDG_DATA_HOME/godot/export_templates.
      # The path must be absolute and free of "..".
      XDG_DATA_HOME: ${{ github.workspace }}/.godot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Install Godot ${{ matrix.minor }}
        env:
          # No pinned manifest in CI: the checksums come from the godot-builds
          # release manifest for the resolved tag. Only unpack the Linux
          # templates the export test needs.
          GODOT_VERIFY: "1"
          GODOT_TEMPLATES: "1"
          GODOT_TEMPLATE_FILES: "templates/version.txt templates/linux_*"
        run: |
          scripts/download-godot.py install-latest "${{ matrix.minor }}"
          binary=$(ls "$GITHUB_WORKSPACE"/.godot/"${{ matrix.minor }}"/Godot_v*_linux.x86_64)
          echo "GODOT_PATH=$binary" >> "$GITHUB_ENV"
      - run: go build -trimpath -o bin/go-dot-mcp ./cmd/go-dot-mcp
      - name: e2e (Godot ${{ matrix.minor }})
        working-directory: e2e
        env:
          GO_DOT_MCP_BIN: ${{ github.workspace }}/bin/go-dot-mcp
          GODOT_MINOR: ${{ matrix.minor }}
        run: |
          go mod download
          go test -race -covermode=atomic ./...
