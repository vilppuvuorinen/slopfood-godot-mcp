name: CI

# main is the only branch that earns CI: every push and manual dispatch runs the
# full `make check` surface (gofmt/vet/lint/unit tests) plus the e2e suite fanned
# out across each supported Godot minor line. The Godot matrix is discovered at
# run time from upstream's newest published build for every minor at or above
# MIN_GODOT_MINOR (dev/beta/rc included), so breakage with an upcoming release
# surfaces early. e2e deliberately does not run on pull requests, where a new
# upstream release could turn a green PR red for unrelated reasons.
#
# The build job stamps every build with a generated version, YYYY.MM.DD-<sha7>,
# and stages the whole release matrix in dist/. A workflow_dispatch additionally
# publishes those exact staged binaries as a GitHub Release tagged with that
# generated version; it never rebuilds, so the release is the artifact the whole
# gate just tested. To release a commit other than main's tip, select it as the
# workflow ref when dispatching.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Pushes supersede each other; a manual release run is never cancelled by a
  # later push landing on main.
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  GO_VERSION: "1.27.1"
  # Lowest supported Godot minor line; bump by hand when support is raised.
  MIN_GODOT_MINOR: "4.7"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      # The version is the build's identity and the release tag: the UTC date
      # plus the short commit, so a main artifact is traceable to its source and
      # every push gets a distinct version. It is passed to make, not derived
      # there, so local builds keep their fixed "dev" marker.
      - name: Generate version
        id: version
        run: |
          set -euo pipefail
          version="$(date -u +%Y.%m.%d)-$(git rev-parse --short=7 HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: go mod download
      # static is the Godot-free half of `make check`: the gofmt gate, vet,
      # lint, race unit tests, and the multi-platform build. The build stages
      # the whole release matrix in dist/ with the generated version, so the
      # release job and both e2e lanes download exactly those files rather than
      # compiling their own. The build target defines no debug tags, so every
      # uploaded artifact is clean.
      - run: make static VERSION="${{ steps.version.outputs.version }}"
      # The release matrix, named with the generated version and checksummed.
      # The release job publishes exactly these files and never rebuilds.
      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  # Discover which minor lines >= MIN_GODOT_MINOR have published releases via
  # the downloader's "minors" subcommand. The release within each line is
  # resolved and installed per e2e job from the minor alone.
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        run: |
          set -euo pipefail
          minors=$(scripts/download-godot.py minors "$MIN_GODOT_MINOR")
          if [[ -z "$minors" ]]; then
            echo "::error::no Godot releases found for minors >= $MIN_GODOT_MINOR" >&2
            exit 1
          fi

          include=""
          while IFS= read -r key; do
            [[ -n "$key" ]] || continue
            [[ -z "$include" ]] || include+=","
            include+="{\"minor\":\"$key\"}"
          done <<<"$minors"

          echo "matrix={\"include\":[$include]}" >> "$GITHUB_OUTPUT"

  e2e:
    needs: [versions, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    env:
      # Godot looks for export templates under $XDG_DATA_HOME/godot/export_templates.
      # The path must be absolute and free of "..".
      XDG_DATA_HOME: ${{ github.workspace }}/.godot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Install Godot ${{ matrix.minor }}
        env:
          # No pinned manifest in CI: checksums come from the godot-builds release
          # manifest. Only unpack the Linux templates the export test needs.
          GODOT_VERIFY: "1"
          GODOT_TEMPLATES: "1"
          GODOT_TEMPLATE_FILES: "templates/version.txt templates/linux_*"
        run: |
          scripts/download-godot.py install-latest "${{ matrix.minor }}"
          binary=$(ls "$GITHUB_WORKSPACE"/.godot/"${{ matrix.minor }}"/Godot_v*_linux.x86_64)
          echo "GODOT_PATH=$binary" >> "$GITHUB_ENV"
      - name: Download cross-compiled server
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      # Artifacts do not carry the executable bit, so restore it before the
      # suite execs the binary directly.
      - run: chmod +x "dist/slopfood-godot-mcp_${{ needs.build.outputs.version }}_linux_amd64"
      - name: e2e (Godot ${{ matrix.minor }})
        working-directory: e2e
        env:
          GODOT_MCP_BIN: ${{ github.workspace }}/dist/slopfood-godot-mcp_${{ needs.build.outputs.version }}_linux_amd64
          GODOT_MINOR: ${{ matrix.minor }}
        run: |
          go mod download
          go test -race -parallel 4 -covermode=atomic ./...

  # e2e-windows exercises the whole runtime on Windows with one Godot build (the
  # newest stable minor line), so the loopback-TCP engine and daemon transports
  # are proven end to end without multiplying Windows build minutes. Only stable
  # lines are considered: the Linux matrix chases dev/rc releases on purpose,
  # but the Windows smoke lane should not hinge on a half-published dev build.
  # It is functional, not the concurrency lane: -race is dropped because the
  # Windows runner has no gcc and the Linux job already covers races.
  e2e-windows:
    needs: [versions, build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      # %APPDATA% does not expand in a workflow env: block and the default
      # Windows shell is PowerShell, so resolve Godot's template root here and
      # export it for the later steps.
      - name: Resolve templates dir
        shell: pwsh
        run: |
          "GODOT_TEMPLATES_DIR=$env:APPDATA\Godot\export_templates" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # One Godot version: the newest stable minor line. The downloader's
      # surface is unchanged; install-latest resolves that line's newest stable
      # release for GODOT_OS=windows. --stable keeps dev lines (e.g. 4.8-dev7)
      # out of the Windows lane.
      - name: Resolve latest stable minor
        shell: pwsh
        run: |
          $minors = python scripts/download-godot.py minors --stable "$env:MIN_GODOT_MINOR"
          $latest = $minors | Select-Object -Last 1
          if (-not $latest) {
            Write-Error "no stable Godot releases found for minors >= $env:MIN_GODOT_MINOR"
            exit 1
          }
          "GODOT_MINOR=$latest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # The Linux members are required even on Windows: the export e2e installs
      # a Linux preset and exports an ELF, so its templates must be present or
      # TestExportProjectTool fails.
      - name: Install Godot ${{ env.GODOT_MINOR }}
        shell: pwsh
        env:
          GODOT_OS: windows
          GODOT_VERIFY: "1"
          GODOT_TEMPLATES: "1"
          GODOT_TEMPLATE_FILES: "templates/version.txt templates/linux_* templates/windows_*"
        run: |
          python scripts/download-godot.py install-latest "$env:GODOT_MINOR"
          $binary = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\.godot\$env:GODOT_MINOR\Godot_v*_win64_console.exe" |
            Select-Object -First 1
          if (-not $binary) { Write-Error "no win64 console engine found"; exit 1 }
          "GODOT_PATH=$($binary.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Download cross-compiled server
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: e2e (Godot ${{ env.GODOT_MINOR }}, windows)
        working-directory: e2e
        shell: pwsh
        env:
          GODOT_MCP_BIN: ${{ github.workspace }}\dist\slopfood-godot-mcp_${{ needs.build.outputs.version }}_windows_amd64.exe
          GODOT_MINOR: ${{ env.GODOT_MINOR }}
        run: |
          go mod download
          go test -parallel 2 -count=1 ./...

  release:
    # Manual dispatch only: pushes never release. It runs after every check, so
    # the tagged commit is one that passed the whole Godot matrix. The version
    # is the one the build job generated for that commit, and the assets are the
    # dist/ files it already built and uploaded: this job downloads and
    # publishes, it never compiles.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [build, e2e, e2e-windows]
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes
