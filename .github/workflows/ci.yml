name: CI

# Runs on main pushes and workflow_dispatch: `make static` plus e2e across every
# supported Godot minor line, including dev/beta/rc. A dispatch additionally
# publishes the staged dist/ binaries as a release tagged with the build version.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Pushes supersede each other; a manual release is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  GO_VERSION: "1.27.1"
  # Lowest supported Godot minor line; bump when support is raised.
  MIN_GODOT_MINOR: "4.7"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      # Version = UTC date + short commit; passed to make so local builds keep
      # their "dev" marker.
      - name: Generate version
        id: version
        run: |
          set -euo pipefail
          version="$(date -u +%Y.%m.%d)-$(git rev-parse --short=7 HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: go mod download
      - run: make static VERSION="${{ steps.version.outputs.version }}"
      # The release job and e2e lanes consume exactly these staged files.
      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  # Build a matrix of published Godot minor lines >= MIN_GODOT_MINOR.
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        run: |
          set -euo pipefail
          minors=$(scripts/download-godot.py minors "$MIN_GODOT_MINOR")
          if [[ -z "$minors" ]]; then
            echo "::error::no Godot releases found for minors >= $MIN_GODOT_MINOR" >&2
            exit 1
          fi

          include=""
          while IFS= read -r key; do
            [[ -n "$key" ]] || continue
            [[ -z "$include" ]] || include+=","
            include+="{\"minor\":\"$key\"}"
          done <<<"$minors"

          echo "matrix={\"include\":[$include]}" >> "$GITHUB_OUTPUT"

  e2e:
    needs: [versions, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    env:
      # Godot resolves export templates under $XDG_DATA_HOME/godot/export_templates.
      XDG_DATA_HOME: ${{ github.workspace }}/.godot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Install Godot ${{ matrix.minor }}
        env:
          # Verify checksums against the godot-builds release manifest.
          GODOT_VERIFY: "1"
          GODOT_TEMPLATES: "1"
          GODOT_TEMPLATE_FILES: "templates/version.txt templates/linux_*"
        run: |
          scripts/download-godot.py install-latest "${{ matrix.minor }}"
          binary=$(ls "$GITHUB_WORKSPACE"/.godot/"${{ matrix.minor }}"/Godot_v*_linux.x86_64)
          echo "GODOT_PATH=$binary" >> "$GITHUB_ENV"
      - name: Download cross-compiled server
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      # Artifacts lose the executable bit; restore it before the suite execs it.
      - run: chmod +x "dist/slopfood-godot-mcp_${{ needs.build.outputs.version }}_linux_amd64"
      - name: e2e (Godot ${{ matrix.minor }})
        working-directory: e2e
        env:
          GODOT_MCP_BIN: ${{ github.workspace }}/dist/slopfood-godot-mcp_${{ needs.build.outputs.version }}_linux_amd64
          GODOT_MINOR: ${{ matrix.minor }}
        run: |
          go mod download
          go test -race -parallel 4 -covermode=atomic ./...

  # Windows smoke lane: one Godot build (newest stable minor), no -race (the
  # runner lacks gcc; Linux covers races).
  e2e-windows:
    needs: [versions, build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      # %APPDATA% does not expand in an env: block; resolve it in PowerShell.
      - name: Resolve templates dir
        shell: pwsh
        run: |
          "GODOT_TEMPLATES_DIR=$env:APPDATA\Godot\export_templates" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # Newest stable minor line; --stable keeps dev lines out of this lane.
      - name: Resolve latest stable minor
        shell: pwsh
        run: |
          $minors = python scripts/download-godot.py minors --stable "$env:MIN_GODOT_MINOR"
          $latest = $minors | Select-Object -Last 1
          if (-not $latest) {
            Write-Error "no stable Godot releases found for minors >= $env:MIN_GODOT_MINOR"
            exit 1
          }
          "GODOT_MINOR=$latest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # Linux templates are needed even here: the export e2e builds a Linux ELF.
      - name: Install Godot ${{ env.GODOT_MINOR }}
        shell: pwsh
        env:
          GODOT_OS: windows
          GODOT_VERIFY: "1"
          GODOT_TEMPLATES: "1"
          GODOT_TEMPLATE_FILES: "templates/version.txt templates/linux_* templates/windows_*"
        run: |
          python scripts/download-godot.py install-latest "$env:GODOT_MINOR"
          $binary = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\.godot\$env:GODOT_MINOR\Godot_v*_win64_console.exe" |
            Select-Object -First 1
          if (-not $binary) { Write-Error "no win64 console engine found"; exit 1 }
          "GODOT_PATH=$($binary.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Download cross-compiled server
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: e2e (Godot ${{ env.GODOT_MINOR }}, windows)
        working-directory: e2e
        shell: pwsh
        env:
          GODOT_MCP_BIN: ${{ github.workspace }}\dist\slopfood-godot-mcp_${{ needs.build.outputs.version }}_windows_amd64.exe
          GODOT_MINOR: ${{ env.GODOT_MINOR }}
        run: |
          go mod download
          go test -parallel 2 -count=1 ./...

  release:
    # Manual dispatch only. Publishes the dist/ files the build job already
    # produced; never compiles.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [build, e2e, e2e-windows]
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes
