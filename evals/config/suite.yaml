# Default suite configuration. Every field is overridable on the command line.
models:
  executor: opencode-go/deepseek-v4.1-flash
  judge: opencode-go/deepseek-v4.1-flash

reps: 3
timeout_s: 300
judge: true
# Concurrent sessions. Each is a full headless Godot process plus an agent, so
# the ceiling is CPU/memory rather than the opencode server.
jobs: 4

shapes:
  - full
  - script_escape
  - read_only

tasks: all
