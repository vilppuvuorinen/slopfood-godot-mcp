# Named toolset shapes.
#
# `mcp` selects MCP tools exposed by the slopfood-godot-mcp server:
#   all                    every tool the server registers
#   none                   no MCP tools
#   [a, b, ...]            an explicit allowlist
#   all-except:a,b         every registered tool except the named ones
#
# `builtin` lists the opencode built-in tools to leave enabled. Anything not
# named here (and not selected above) is explicitly disabled in the prompt, so
# a shape is fully reproducible.
#
# `expect_alias` grades a shape with another shape's trajectory expectations, so
# a variant that exposes a superset of the tools the expectations name can reuse
# its parent's `expect` block instead of duplicating it per task.
shapes:
  full:
    description: All MCP tools plus shell and file-writing built-ins.
    mcp: all
    builtin: [bash, edit, write, read, glob, grep]

  no_mcp:
    description: No MCP tools; built-ins only. Control baseline for whether the server helps at all.
    mcp: none
    builtin: [bash, edit, write, read, glob, grep]
