id: animate_nested
description: Animate a nested node's scale with an AnimationPlayer.
fixture: animate_nested
prompt: |
  In main.tscn, add an AnimationPlayer named "Anim" as a direct child of the
  scene root. Give it an animation named "pop" of length 0.5 seconds that
  animates the scale of Root/Hero/Sprite from Vector2(1, 1) at t=0 to
  Vector2(2, 2) at t=0.5, and make "pop" play automatically. Save the scene.
checks:
  - kind: file_contains
    path: res://main.tscn
    value: 'type="AnimationPlayer"'
  - kind: file_contains
    path: res://main.tscn
    value: 'name="Anim"'
  - kind: file_contains
    path: res://main.tscn
    value: 'length = 0.5'
  - kind: file_contains
    path: res://main.tscn
    value: 'NodePath("Hero/Sprite:scale")'
  - kind: file_contains
    path: res://main.tscn
    value: 'Vector2(2, 2)'
  - kind: file_contains
    path: res://main.tscn
    value: '&"pop"'
expect:
  script_escape:
    used_all: [godot_run_script]
    used_none: [edit, write]
rubric: |
  main.tscn has a direct child AnimationPlayer named Anim with an animation
  "pop" (0.5s) tracking Hero/Sprite:scale from (1, 1) to (2, 2), set to autoplay.
timeout_s: 360
