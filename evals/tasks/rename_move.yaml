id: rename_move
description: Rename a node and reparent another under it.
fixture: rename_move
prompt: |
  In main.tscn, rename the node at Root/A to "Hero", then move (reparent) the
  node at Root/B so that it becomes a child of Root/Hero. Save the scene.
checks:
  - kind: node_exists
    scene: res://main.tscn
    path: Hero
  - kind: node_not_exists
    scene: res://main.tscn
    path: A
  - kind: node_exists
    scene: res://main.tscn
    path: Hero/B
  - kind: node_not_exists
    scene: res://main.tscn
    path: B
expect:
  full:
    used_all: [godot_rename_scene_node, godot_move_scene_node]
  script_escape:
    used_all: [godot_run_script]
rubric: |
  The root has a child named Hero (formerly A), B no longer sits directly under
  the root, and Root/Hero/B exists.
timeout_s: 300
