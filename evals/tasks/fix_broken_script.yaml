id: fix_broken_script
description: Find and fix a GDScript parse error using script validation.
fixture: fix_broken_script
prompt: |
  The script res://player.gd does not parse. Fix it so it defines a method
  `func greet() -> String` that returns "hi", then validate every script in the
  project and confirm they all pass.
checks:
  - kind: script_has_method
    path: res://player.gd
    value: greet
  - kind: file_contains
    path: res://player.gd
    value: extends Node
expect:
  full:
    used_all: [godot_validate_scripts]
  script_escape:
    used_all: [godot_validate_scripts]
rubric: |
  res://player.gd parses, extends Node, and exposes greet() returning "hi";
  validate_scripts reports every project script as valid.
timeout_s: 300
