id: animate_position
description: Add an AnimationPlayer that animates a node's position.
fixture: animate_position
prompt: |
  In main.tscn, add an AnimationPlayer named "Anim" as a direct child of the
  scene root. Give it an animation named "bob" of length 1.5 seconds that
  animates Root/Sprite's position from Vector2(0, 0) at t=0 to Vector2(0, -20)
  at t=1.5, and make "bob" play automatically. Save the scene.
checks:
  - kind: file_contains
    path: res://main.tscn
    value: 'type="AnimationPlayer"'
  - kind: file_contains
    path: res://main.tscn
    value: 'name="Anim"'
  - kind: file_contains
    path: res://main.tscn
    value: 'length = 1.5'
  - kind: file_contains
    path: res://main.tscn
    value: 'NodePath("Sprite:position")'
  - kind: file_contains
    path: res://main.tscn
    value: 'Vector2(0, -20)'
  - kind: file_contains
    path: res://main.tscn
    value: '&"bob"'
expect:
  script_escape:
    used_all: [godot_run_script]
    used_none: [edit, write]
rubric: |
  main.tscn has a direct child AnimationPlayer named Anim with an animation
  "bob" (1.5s) tracking Sprite:position from (0, 0) to (0, -20), set to autoplay.
timeout_s: 360
