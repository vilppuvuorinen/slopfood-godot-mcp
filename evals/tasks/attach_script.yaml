id: attach_script
description: Create a GDScript with a method and attach it to a node.
fixture: attach_script
prompt: |
  Create a new GDScript file at res://player.gd that extends CharacterBody2D and
  defines an integer method:

      func speed() -> int:
          return 5

  Then attach that script to the existing node at Root/Player in main.tscn and
  save the scene.
checks:
  - kind: file_exists
    path: res://player.gd
  - kind: script_has_method
    path: res://player.gd
    value: speed
  - kind: node_script
    scene: res://main.tscn
    path: Player
    value: player.gd
targets:
  - path: res://player.gd
    form: text
  - path: res://main.tscn
    form: text
rubric: |
  res://player.gd exists, extends CharacterBody2D, exposes a speed() method, and
  is attached to Root/Player.
timeout_s: 300
