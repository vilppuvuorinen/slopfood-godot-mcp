id: animate_tracks
description: Add an AnimationPlayer with several named animations across nested nodes.
fixture: animate_tracks
prompt: |
  In main.tscn, add an AnimationPlayer named "Anim" as a direct child of the
  scene root. Give it three animations and make "bob" play automatically:

    - "bob":  1.5 seconds, animates Root/Sprite's position from Vector2(0, 0)
              at t=0 to Vector2(0, -20) at t=1.5
    - "pop":  0.5 seconds, animates Root/Hero/Sprite's scale from Vector2(1, 1)
              at t=0 to Vector2(2, 2) at t=0.5
    - "fade": 1.25 seconds, animates Root/Sprite's modulate from Color(1, 1, 1, 1)
              at t=0 to Color(1, 0, 0, 1) at t=1.25

  Save the scene.
checks:
  - kind: file_contains
    path: res://main.tscn
    value: 'type="AnimationPlayer"'
  - kind: file_contains
    path: res://main.tscn
    value: 'name="Anim"'
  - kind: file_contains
    path: res://main.tscn
    value: 'length = 1.5'
  - kind: file_contains
    path: res://main.tscn
    value: 'length = 0.5'
  - kind: file_contains
    path: res://main.tscn
    value: 'length = 1.25'
  - kind: file_contains
    path: res://main.tscn
    value: 'NodePath("Sprite:position")'
  - kind: file_contains
    path: res://main.tscn
    value: 'NodePath("Hero/Sprite:scale")'
  - kind: file_contains
    path: res://main.tscn
    value: 'NodePath("Sprite:modulate")'
  - kind: file_contains
    path: res://main.tscn
    value: 'Vector2(0, -20)'
  - kind: file_contains
    path: res://main.tscn
    value: 'Vector2(2, 2)'
  - kind: file_contains
    path: res://main.tscn
    value: 'Color(1, 0, 0, 1)'
  - kind: file_contains
    path: res://main.tscn
    value: '&"bob"'
  - kind: file_contains
    path: res://main.tscn
    value: '&"pop"'
  - kind: file_contains
    path: res://main.tscn
    value: '&"fade"'
expect:
  full:
    used_all: [godot_run_script]
  script_escape:
    used_all: [godot_run_script]
rubric: |
  main.tscn has a direct child AnimationPlayer named Anim with three animations:
  "bob" (1.5s) tracking Sprite:position from (0, 0) to (0, -20), "pop" (0.5s)
  tracking Hero/Sprite:scale from (1, 1) to (2, 2), and "fade" (1.25s) tracking
  Sprite:modulate from opaque white to opaque red. "bob" is the autoplay
  animation.
timeout_s: 420
