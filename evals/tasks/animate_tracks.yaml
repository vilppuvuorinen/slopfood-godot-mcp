id: animate_tracks
description: Add an AnimationPlayer with several named animations across nested nodes.
fixture: animate_tracks
prompt: |
  In main.tscn, add an AnimationPlayer named "Anim" as a direct child of the
  scene root. Give it three animations and make "bob" play automatically:

    - "bob":  1.5 seconds, animates Root/Sprite's position from Vector2(0, 0)
              at t=0 to Vector2(0, -20) at t=1.5
    - "pop":  0.5 seconds, animates Root/Hero/Sprite's scale from Vector2(1, 1)
              at t=0 to Vector2(2, 2) at t=0.5
    - "fade": 1.25 seconds, animates Root/Sprite's modulate from Color(1, 1, 1, 1)
              at t=0 to Color(1, 0, 0, 1) at t=1.25

  Save the scene.
checks:
  - kind: node_exists
    scene: res://main.tscn
    path: Anim
    required: true
  - kind: node_type
    scene: res://main.tscn
    path: Anim
    value: AnimationPlayer
  # Load the AnimationPlayer and inspect the Animation resources rather than
  # trusting substrings in the serialized text: the artifact must actually be a
  # well-formed AnimationPlayer with the named, correctly-shaped animations.
  - kind: animation_exists
    scene: res://main.tscn
    node: Anim
    name: bob
    length: 1.5
    tracks: 1
    paths: ["Sprite:position"]
    required: true
    weight: 2
  - kind: animation_exists
    scene: res://main.tscn
    node: Anim
    name: pop
    length: 0.5
    tracks: 1
    paths: ["Hero/Sprite:scale"]
    required: true
    weight: 2
  - kind: animation_exists
    scene: res://main.tscn
    node: Anim
    name: fade
    length: 1.25
    tracks: 1
    paths: ["Sprite:modulate"]
    required: true
    weight: 2
  # "bob" must be the autoplay animation.
  - kind: node_property
    scene: res://main.tscn
    path: Anim
    property: autoplay
    value: bob
  # Cheap diagnostics: the shipped text still carries the expected values.
  - kind: file_contains
    path: res://main.tscn
    value: 'Vector2(0, -20)'
  - kind: file_contains
    path: res://main.tscn
    value: 'Vector2(2, 2)'
  - kind: file_contains
    path: res://main.tscn
    value: 'Color(1, 0, 0, 1)'
targets:
  - path: res://main.tscn
    form: text
rubric: |
  main.tscn has a direct child AnimationPlayer named Anim with three animations:
  "bob" (1.5s) tracking Sprite:position from (0, 0) to (0, -20), "pop" (0.5s)
  tracking Hero/Sprite:scale from (1, 1) to (2, 2), and "fade" (1.25s) tracking
  Sprite:modulate from opaque white to opaque red. "bob" is the autoplay
  animation.
timeout_s: 420
